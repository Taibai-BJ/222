<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="北京、长沙、正定、宁波四城天气实时对比" />
<title>四城天气实时对比</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⛅</text></svg>" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
    min-height: 100vh;
    background: linear-gradient(160deg, #101c2c 0%, #1b2f47 55%, #14232f 100%);
    background-attachment: fixed;
    color: #fff;
    padding-bottom: 48px;
  }

  .container { max-width: 1180px; margin: 0 auto; padding: 26px 20px 0; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; flex-wrap: wrap; }
  header h1 { font-size: 26px; font-weight: 700; letter-spacing: 1px; }
  header p { opacity: .82; font-size: 13px; margin-top: 6px; }
  #refreshBtn {
    padding: 9px 18px; border-radius: 12px; cursor: pointer; font-size: 14px;
    background: rgba(255,255,255,.12); color: #fff;
    border: 1px solid rgba(255,255,255,.35); transition: .2s; backdrop-filter: blur(4px);
  }
  #refreshBtn:hover { background: rgba(255,255,255,.28); }
  #refreshBtn:disabled { opacity: .5; cursor: wait; }

  .status { text-align: center; padding: 40px 0; font-size: 15px; opacity: .92; }
  .hidden { display: none !important; }
  .warn {
    margin-top: 16px; padding: 12px 16px; border-radius: 12px; font-size: 13px;
    background: rgba(255,193,7,.14); border: 1px solid rgba(255,193,7,.4); color: #ffe08a;
  }

  .card {
    background: rgba(255,255,255,.08);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid rgba(255,255,255,.16);
    border-radius: 18px;
    box-shadow: 0 8px 28px rgba(0,0,0,.22);
  }

  .section-title { margin: 30px 0 12px; font-size: 17px; font-weight: 600; display: flex; align-items: center; gap: 8px; }

  /* ---------- 四城卡片 ---------- */
  #cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-top: 8px; }
  .city-card {
    border-radius: 18px; padding: 18px 16px; color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.25);
    transition: transform .18s ease;
  }
  .city-card:hover { transform: translateY(-3px); }
  .cc-head { display: flex; justify-content: space-between; align-items: baseline; }
  .cc-name { font-size: 19px; font-weight: 700; }
  .cc-time { font-size: 11px; opacity: .85; }
  .cc-cond { margin-top: 8px; font-size: 15px; display: flex; align-items: center; gap: 7px; }
  .cc-temp { font-size: 46px; font-weight: 200; line-height: 1.1; margin: 6px 0 2px; }
  .cc-temp small { font-size: 18px; font-weight: 400; opacity: .8; }
  .cc-range { font-size: 13px; opacity: .95; }
  .cc-stats { display: flex; gap: 12px; margin-top: 10px; font-size: 12px; opacity: .92; flex-wrap: wrap; }
  .cc-err { margin-top: 10px; font-size: 13px; opacity: .9; line-height: 1.7; }

  /* ---------- 对比表格通用 ---------- */
  .table-wrap { overflow-x: auto; padding: 6px 4px; }
  table { width: 100%; border-collapse: collapse; min-width: 720px; }
  th, td { padding: 11px 10px; text-align: center; font-size: 14px; }
  thead th { font-size: 15px; font-weight: 700; background: rgba(255,255,255,.12); }
  thead th:first-child, tbody td:first-child {
    text-align: left; padding-left: 18px; font-weight: 600; width: 118px; white-space: nowrap;
  }
  tbody tr:nth-child(even) { background: rgba(255,255,255,.045); }
  tbody tr:hover { background: rgba(255,255,255,.09); }
  tbody td:first-child { color: rgba(255,255,255,.8); }
  .metric-cell { font-size: 15px; }
  .cond-cell { font-size: 14px; white-space: nowrap; }
  .tag-hot { font-size: 11px; color: #ffd166; margin-left: 4px; }
  .tag-cold { font-size: 11px; color: #7fd4ff; margin-left: 4px; }

  /* 温度条 */
  .tbar { height: 5px; border-radius: 3px; background: rgba(0,0,0,.25); margin: 6px auto 0; width: 72%; overflow: hidden; }
  .tbar i { display: block; height: 100%; border-radius: 3px; background: linear-gradient(90deg, #4facfe, #f7971e); }

  /* ---------- 7 天对比 ---------- */
  tr.today td { background: rgba(255,255,255,.09); }
  tr.today td:first-child { color: #ffd166; }
  .d-cond { white-space: nowrap; }
  .d-temp { font-size: 13px; margin-top: 3px; }
  .d-temp .max { font-weight: 700; }
  .d-temp .min { opacity: .7; margin-left: 4px; }
  .d-pop { font-size: 11px; opacity: .75; margin-top: 3px; }

  footer { text-align: center; margin-top: 42px; font-size: 12px; opacity: .7; }

  @media (max-width: 1080px) { #cards { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 620px)  { #cards { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1>⛅ 四城天气实时对比</h1>
        <p>北京 · 长沙 · 正定 · 宁波 —— 相同指标横向对比，一目了然</p>
      </div>
      <button id="refreshBtn">⟳ 刷新</button>
    </header>

    <div id="status" class="status">⏳ 正在加载四城天气…</div>
    <div id="warn" class="warn hidden"></div>

    <!-- 四城概览卡片 -->
    <div id="cards" class="hidden"></div>

    <!-- 实时指标对比 -->
    <h3 class="section-title">📊 实时指标对比</h3>
    <div id="metricTable" class="card table-wrap hidden">
      <table>
        <thead>
          <tr>
            <th>指标</th>
            <th>北京</th>
            <th>长沙</th>
            <th>正定</th>
            <th>宁波</th>
          </tr>
        </thead>
        <tbody id="metricBody"></tbody>
      </table>
    </div>

    <!-- 未来 7 天对比 -->
    <h3 class="section-title">📅 未来 7 天预报对比</h3>
    <div id="dailyTable" class="card table-wrap hidden">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>北京</th>
            <th>长沙</th>
            <th>正定</th>
            <th>宁波</th>
          </tr>
        </thead>
        <tbody id="dailyBody"></tbody>
      </table>
    </div>

    <footer>数据来源：Open-Meteo 开放天气接口 · 各城市按本地时区显示 · 仅供学习参考</footer>
  </div>

<script>
"use strict";

/* ==================== 四个固定城市 ==================== */
const CITIES = [
  { name: "北京", lat: 39.9042, lon: 116.4074, accent: "#ffd166" },
  { name: "长沙", lat: 28.2282, lon: 112.9388, accent: "#ff8a80" },
  { name: "正定", lat: 38.1450, lon: 114.5656, accent: "#4ecdc4" },
  { name: "宁波", lat: 29.8782, lon: 121.5495, accent: "#74b9ff" },
];

/* ==================== WMO 天气代码 → 中文 / 图标 ==================== */
const WMO = {
  0:  ["晴", "☀️"], 1: ["基本晴朗", "🌤️"], 2: ["局部多云", "⛅"], 3: ["阴天", "☁️"],
  45: ["雾", "🌫️"], 48: ["冻雾", "🌫️"],
  51: ["毛毛雨", "🌦️"], 53: ["毛毛雨", "🌦️"], 55: ["毛毛雨", "🌦️"],
  56: ["冻毛毛雨", "🌧️"], 57: ["冻毛毛雨", "🌧️"],
  61: ["小雨", "🌧️"], 63: ["中雨", "🌧️"], 65: ["大雨", "🌧️"],
  66: ["冻雨", "🌧️"], 67: ["冻雨", "🌧️"],
  71: ["小雪", "🌨️"], 73: ["中雪", "🌨️"], 75: ["大雪", "❄️"], 77: ["雪粒", "❄️"],
  80: ["阵雨", "🌦️"], 81: ["阵雨", "🌦️"], 82: ["强阵雨", "⛈️"],
  85: ["阵雪", "🌨️"], 86: ["强阵雪", "🌨️"],
  95: ["雷阵雨", "⛈️"], 96: ["雷阵雨伴冰雹", "⛈️"], 99: ["雷暴伴冰雹", "⛈️"],
};
const wmoInfo = (code) => WMO[code] || ["未知", "❓"];

/* ==================== 工具 ==================== */
const pad = (n) => String(n).padStart(2, "0");
const fmtTime = (iso) => (iso ? iso.slice(11, 16) : "—");
function windDir(deg) {
  const dirs = ["北", "东北", "东", "东南", "南", "西南", "西", "西北"];
  return dirs[Math.round(deg / 45) % 8] + "风";
}

/* 卡片背景：按天气 + 昼夜 */
function bgFor(code, isDay) {
  const c = Number(code);
  if (c === 0 || c === 1) return isDay ? "linear-gradient(135deg,#2193b0,#6dd5ed)" : "linear-gradient(135deg,#0f2027,#203a43,#2c5364)";
  if (c === 2) return isDay ? "linear-gradient(135deg,#4d6b88,#93aec7)" : "linear-gradient(135deg,#1d2b3a,#2e4258)";
  if (c === 3) return isDay ? "linear-gradient(135deg,#4e5f70,#8495a5)" : "linear-gradient(135deg,#222a33,#3a4654)";
  if (c === 45 || c === 48) return "linear-gradient(135deg,#67768a,#a9b8c6)";
  if (c >= 95) return "linear-gradient(135deg,#3b3f57,#5b6b8f)";
  if (c >= 71 && c <= 86) return isDay ? "linear-gradient(135deg,#7fa8cc,#cfe4f2)" : "linear-gradient(135deg,#33475c,#4d6479)";
  if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) return isDay ? "linear-gradient(135deg,#33586c,#5d8aa0)" : "linear-gradient(135deg,#16222a,#2d4654)";
  return isDay ? "linear-gradient(135deg,#2193b0,#6dd5ed)" : "linear-gradient(135deg,#0f2027,#203a43,#2c5364)";
}

/* ==================== 状态与数据 ==================== */
const $ = (id) => document.getElementById(id);
const cityData = {}; // 城市名 -> 天气数据（失败为 null）

function setLoading(on, msg) {
  const s = $("status");
  if (on) { s.classList.remove("hidden"); s.textContent = msg || "⏳ 加载中…"; }
  else s.classList.add("hidden");
  $("refreshBtn").disabled = on;
}

async function fetchCity(city) {
  const params = new URLSearchParams({
    latitude: city.lat,
    longitude: city.lon,
    current: "temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m,wind_direction_10m,surface_pressure,uv_index",
    daily: "weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max,sunrise,sunset",
    timezone: "auto",
    forecast_days: 7,
  });
  const res = await fetch(`https://api.open-meteo.com/v1/forecast?${params}`);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function loadAll() {
  setLoading(true, "⏳ 正在加载四城天气…");
  const settled = await Promise.allSettled(CITIES.map(fetchCity));
  settled.forEach((r, i) => { cityData[CITIES[i].name] = r.status === "fulfilled" ? r.value : null; });

  const ok = settled.filter((r) => r.status === "fulfilled").length;
  const warnEl = $("warn");
  warnEl.classList.toggle("hidden", ok === CITIES.length);
  warnEl.textContent = ok === 0
    ? "❌ 四个城市全部加载失败，请检查网络后点击刷新。"
    : `⚠️ 有 ${CITIES.length - ok} 个城市（${CITIES.filter((c, i) => settled[i].status !== "fulfilled").map((c) => c.name).join("、")}）加载失败，已显示其余城市数据。`;

  renderCards();
  renderMetricTable();
  renderDailyTable();
  setLoading(false);
}

/* ==================== 四城概览卡片 ==================== */
function renderCards() {
  const wrap = $("cards");
  wrap.classList.remove("hidden");
  wrap.innerHTML = "";
  CITIES.forEach((city) => {
    const d = cityData[city.name];
    const card = document.createElement("div");
    card.className = "city-card";
    if (!d) {
      card.style.background = "linear-gradient(135deg,#3a4252,#5a6478)";
      card.innerHTML = `<div class="cc-head"><span class="cc-name" style="color:${city.accent}">${city.name}</span></div>
        <div class="cc-err">数据获取失败<br><span style="opacity:.7">请点击右上角刷新</span></div>`;
      wrap.appendChild(card);
      return;
    }
    const cur = d.current, dl = d.daily;
    const [text, icon] = wmoInfo(cur.weather_code);
    card.style.background = bgFor(cur.weather_code, cur.is_day);
    card.innerHTML = `
      <div class="cc-head">
        <span class="cc-name" style="color:${city.accent}">${city.name}</span>
        <span class="cc-time">🕐 ${fmtTime(cur.time)}</span>
      </div>
      <div class="cc-cond"><span style="font-size:24px">${icon}</span><span>${text}</span></div>
      <div class="cc-temp">${Math.round(cur.temperature_2m)}<small>°C</small></div>
      <div class="cc-range">最高 <b>${Math.round(dl.temperature_2m_max[0])}°</b> · 最低 <b>${Math.round(dl.temperature_2m_min[0])}°</b></div>
      <div class="cc-stats">
        <span>💧 湿度 ${cur.relative_humidity_2m}%</span>
        <span>💨 ${Math.round(cur.wind_speed_10m)} km/h</span>
        <span>🌡️ 体感 ${Math.round(cur.apparent_temperature)}°</span>
      </div>`;
    wrap.appendChild(card);
  });
}

/* ==================== 实时指标对比表 ==================== */
const METRICS = [
  { key: "condition", label: "天气状况" },
  { key: "temp",      label: "当前温度", rowId: "row-temp" },
  { key: "feels",     label: "体感温度" },
  { key: "max",       label: "今日最高温", rowId: "row-max" },
  { key: "min",       label: "今日最低温", rowId: "row-min" },
  { key: "humidity",  label: "相对湿度" },
  { key: "wind",      label: "风速风向" },
  { key: "precip",    label: "降水量" },
  { key: "pressure",  label: "气压" },
  { key: "uv",        label: "紫外线指数" },
  { key: "sunrise",   label: "日出" },
  { key: "sunset",    label: "日落" },
];

function metricValue(key, d) {
  const cur = d.current, dl = d.daily;
  switch (key) {
    case "condition": { const [t, i] = wmoInfo(cur.weather_code); return `<span class="cond-cell">${i} ${t}</span>`; }
    case "temp":    return Math.round(cur.temperature_2m);
    case "feels":   return Math.round(cur.apparent_temperature) + "°";
    case "max":     return Math.round(dl.temperature_2m_max[0]) + "°";
    case "min":     return Math.round(dl.temperature_2m_min[0]) + "°";
    case "humidity":return cur.relative_humidity_2m + "%";
    case "wind":    return `${Math.round(cur.wind_speed_10m)} km/h ${windDir(cur.wind_direction_10m)}`;
    case "precip":  return cur.precipitation + " mm";
    case "pressure":return Math.round(cur.surface_pressure) + " hPa";
    case "uv":      return (cur.uv_index != null) ? Number(cur.uv_index).toFixed(1) : "—";
    case "sunrise": return fmtTime(dl.sunrise[0]);
    case "sunset":  return fmtTime(dl.sunset[0]);
    default: return "—";
  }
}

function renderMetricTable() {
  const tbody = $("metricBody");
  $("metricTable").classList.remove("hidden");
  let html = "";
  METRICS.forEach((m) => {
    html += `<tr id="${m.rowId || ""}"><td>${m.label}</td>`;
    html += CITIES.map((c) => {
      const d = cityData[c.name];
      if (!d) return `<td class="metric-cell">—</td>`;
      return `<td class="metric-cell" data-v="${m.key === "temp" ? Math.round(d.current.temperature_2m) : ""}">${metricValue(m.key, d)}</td>`;
    }).join("");
    html += "</tr>";
  });
  tbody.innerHTML = html;
  applyTempExtras();
}

/* 当前温度行：标出最热/最冷 + 温度对比条；最高/最低温行：标出极端 */
function applyTempExtras() {
  ["row-temp", "row-max", "row-min"].forEach((rowId) => {
    const tr = $(rowId);
    if (!tr) return;
    const cells = [...tr.querySelectorAll("td.metric-cell")];
    const vals = cells.map((td) => parseFloat(td.dataset.v)).filter((v) => !isNaN(v));
    if (vals.length < 1) return;
    const maxV = Math.max(...vals), minV = Math.min(...vals);
    cells.forEach((td) => {
      const v = parseFloat(td.dataset.v);
      if (isNaN(v)) return;
      if (vals.length > 1) {
        if (v === maxV) td.insertAdjacentHTML("beforeend", `<span class="tag-hot">🔥最高</span>`);
        if (v === minV) td.insertAdjacentHTML("beforeend", `<span class="tag-cold">❄️最低</span>`);
      }
      if (rowId === "row-temp") {
        const pct = vals.length > 1 ? Math.max(6, ((v - minV) / (maxV - minV)) * 100) : 100;
        td.insertAdjacentHTML("beforeend", `<div class="tbar"><i style="width:${pct}%"></i></div>`);
      }
    });
  });
}

/* ==================== 未来 7 天对比表 ==================== */
function renderDailyTable() {
  const tbody = $("dailyBody");
  $("dailyTable").classList.remove("hidden");

  // 用第一个有数据的城市确定日期与"今天"
  const any = CITIES.map((c) => cityData[c.name]).find((d) => d);
  if (!any) { tbody.innerHTML = `<tr><td colspan="5">暂无数据</td></tr>`; return; }
  const todayStr = any.current.time.slice(0, 10);

  let html = "";
  for (let i = 0; i < 7; i++) {
    let dateStr = null;
    for (const c of CITIES) { if (cityData[c.name]) { dateStr = cityData[c.name].daily.time[i]; break; } }
    let label = "";
    if (dateStr) {
      const dt = new Date(dateStr + "T12:00:00");
      const isToday = dateStr === todayStr;
      label = `${isToday ? "今天" : "周" + "日一二三四五六"[dt.getDay()]} ${dt.getMonth() + 1}/${dt.getDate()}`;
    }
    html += `<tr class="${dateStr === todayStr ? "today" : ""}"><td>${label}</td>`;
    html += CITIES.map((c) => {
      const d = cityData[c.name];
      if (!d) return `<td class="metric-cell">—</td>`;
      const dl = d.daily;
      const [t, icon] = wmoInfo(dl.weather_code[i]);
      const pop = dl.precipitation_probability_max[i];
      return `<td class="metric-cell">
        <div class="d-cond">${icon} ${t}</div>
        <div class="d-temp"><span class="max">${Math.round(dl.temperature_2m_max[i])}°</span><span class="min">${Math.round(dl.temperature_2m_min[i])}°</span></div>
        <div class="d-pop">${pop != null ? `💦 ${Math.round(pop)}%` : ""}</div>
      </td>`;
    }).join("");
    html += "</tr>";
  }
  tbody.innerHTML = html;
}

/* ==================== 事件与启动 ==================== */
$("refreshBtn").addEventListener("click", loadAll);
loadAll();
</script>
</body>
</html>
